[package]
name = "nautik-desktop"
description = "NautiK — application desktop Tauri 2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "nautik_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
# Coffre du système pour le jeton Signal K (SECURITY.md §3).
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
chrono.workspace = true
nav-alarms.workspace = true
nav-charts.workspace = true
nav-core.workspace = true
nav-engine.workspace = true
nav-routing.workspace = true
nav-storage.workspace = true
nav-weather.workspace = true
serde.workspace = true
tauri = { version = "2", features = [] }
# Boîtes de dialogue natives (import/export GPX), appelées uniquement
# depuis Rust : aucune permission n'est accordée au frontend.
tauri-plugin-dialog = "2"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[workspace]
resolver = "2"
members = [
    "apps/daemon",
    "apps/desktop/src-tauri",
    "crates/nav-core",
    "crates/nav-geodesy",
    "crates/nav-nmea0183",
    "crates/nav-nmea2000",
    "crates/nav-signalk",
    "crates/nav-ais",
    "crates/nav-charts",
    "crates/nav-routing",
    "crates/nav-alarms",
    "crates/nav-engine",
    "crates/nav-storage",
    "crates/nav-api",
    "crates/nav-weather",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
repository = "https://github.com/laurentpellet/NautiK"
publish = false

[workspace.dependencies]
# Crates internes
nav-ais = { path = "crates/nav-ais" }
nav-alarms = { path = "crates/nav-alarms" }
nav-api = { path = "crates/nav-api" }
nav-core = { path = "crates/nav-core" }
nav-engine = { path = "crates/nav-engine" }
nav-charts = { path = "crates/nav-charts" }
nav-geodesy = { path = "crates/nav-geodesy" }
nav-nmea0183 = { path = "crates/nav-nmea0183" }
nav-routing = { path = "crates/nav-routing" }
nav-signalk = { path = "crates/nav-signalk" }
nav-storage = { path = "crates/nav-storage" }
nav-weather = { path = "crates/nav-weather" }

# Dépendances communes
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
# Port série (sans libudev : énumération des ports par sysfs sous Linux).
tokio-serial = { version = "5.4", default-features = false }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

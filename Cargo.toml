[workspace]
resolver = "2"
members = [
    "apps/daemon",
    "apps/desktop/src-tauri",
    "crates/nav-core",
    "crates/nav-geodesy",
    "crates/nav-nmea0183",
    "crates/nav-nmea2000",
    "crates/nav-signalk",
    "crates/nav-ais",
    "crates/nav-charts",
    "crates/nav-routing",
    "crates/nav-alarms",
    "crates/nav-storage",
    "crates/nav-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
repository = "https://github.com/laurentpellet/NautiK"
publish = false

[workspace.dependencies]
# Crates internes
nav-core = { path = "crates/nav-core" }

# Dépendances communes
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[package]
name = "nav-storage"
description = "NautiK — Persistance SQLite : migrations, repositories et transactions. Seul point d'accès à la base."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
nav-core.workspace = true
nav-routing.workspace = true
serde.workspace = true
serde_json.workspace = true
# `migrate` + `macros` : migrations embarquées via `sqlx::migrate!`.
# Les requêtes sont construites à l'exécution (pas de base requise à la compilation).
sqlx = { workspace = true, features = ["migrate", "macros"] }
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true

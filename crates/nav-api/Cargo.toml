[package]
name = "nav-api"
description = "NautiK — API distante Axum : REST, WebSocket, authentification et contrôle d'accès."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Serveur HTTP/WebSocket retenu par ARCHITECTURE.md (§1, §4 nav-api).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
nav-alarms.workspace = true
nav-core.workspace = true
nav-engine.workspace = true
nav-routing.workspace = true
nav-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
chrono.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
# Appel du routeur sans réseau (`oneshot`) ; déjà dépendance d'Axum.
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
